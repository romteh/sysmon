# /etc/sysmon.conf - configuration for the sysmon resource/pressure monitor.
#
# sysmon only OBSERVES, LOGS and NOTIFIES. It never kills processes, restarts
# services, drops caches or changes any system setting.
#
# After editing:  sudo systemctl restart sysmon
# Check syntax:   sysmon config
#
# "hold" values are seconds a condition must persist before it counts.
# PSI values are percentages (0-100) from /proc/pressure/*.

[general]
# Sampling interval in seconds.
interval = 5
# Seconds all signals must stay below WARNING before RECOVERY is declared.
recovery_hold = 60
# Disks to watch for utilisation (comma list, or "auto" = all physical disks).
disks = auto

[memory]
# Absolute available-RAM thresholds (MemAvailable as % of MemTotal).
avail_warn_pct = 15
avail_crit_pct = 7.5
avail_warn_hold = 15
avail_crit_hold = 10
# Memory PSI. "some" = at least one task stalled on memory,
# "full" = all non-idle tasks stalled at the same time (system-wide stall).
psi_some_warn = 10
psi_some_warn_hold = 15
psi_some_crit = 40
psi_full_crit = 10
psi_crit_hold = 10

[trend]
# RAM exhaustion prediction (first-class early-warning signal).
# Headroom = MemAvailable + SwapFree - floor; its slope is estimated with a
# robust (Theil-Sen, median-of-pairwise-slopes) fit over `window` seconds,
# so short allocation spikes do not cause false alarms.
enabled = yes
window = 90
# "Exhausted" means headroom reaches this % of MemTotal.
floor_pct = 3
# Ignore declines slower than this (MB/s).
min_rate_mb_s = 5
# Only predict when MemAvailable is below this % (avoids alarms from large
# but harmless allocations while lots of RAM is still free).
arm_below_avail_pct = 30
warn_eta = 300
crit_eta = 90
warn_hold = 10
crit_hold = 10

[swap]
used_warn_pct = 50
swapout_warn_mb_s = 5
activity_warn_mb_s = 20
warn_hold = 30
# CRITICAL when swap is nearly full AND available RAM is below avail_warn_pct.
used_crit_pct = 90
crit_hold = 10

[reclaim]
# Thrashing: page-cache/anon pages re-read shortly after being evicted.
refault_warn_pages_s = 5000
# Direct reclaim: allocating tasks forced to reclaim memory themselves.
allocstall_warn_s = 50
pgscan_direct_warn_pages_s = 20000
majfault_warn_s = 3000
warn_hold = 20

[io]
psi_full_warn = 15
psi_some_warn = 40
psi_warn_hold = 30
psi_full_crit = 40
psi_crit_hold = 15
# Tasks blocked on I/O (procs_blocked, D-state).
blocked_warn = 5
blocked_warn_hold = 30
blocked_crit = 15
blocked_crit_hold = 15
# Disk utilisation % combined with CPU iowait %.
util_warn = 90
iowait_warn = 15
util_warn_hold = 60
util_crit = 98
iowait_crit = 30
util_crit_hold = 30

[cpu]
psi_some_avg60_warn = 50
psi_warn_hold = 15
# load1 thresholds as a multiple of the number of CPUs.
load_warn_factor = 1.5
load_warn_hold = 60
psi_some_crit = 85
load_crit_factor = 2.0
crit_hold = 60

[combination]
# Escalate to CRITICAL when at least this many of the categories
# memory / io / cpu are simultaneously at WARNING or above.
enabled = yes
min_categories = 2

[space]
filesystems = /, /boot/efi
check_interval = 60
warn_used_pct = 90
crit_used_pct = 95
warn_free_gb = 25
crit_free_gb = 10
# GB limits apply only to filesystems at least this large.
gb_rules_min_size_gb = 100
recovery_hold = 600

[notify]
# Suppress a new WARNING notification this soon after a RECOVERY (seconds).
flap_guard = 300
# Minimum seconds between "update" notifications within one WARNING episode.
update_interval = 120
# Also broadcast CRITICAL alerts to all terminals/TTYs with wall(1).
wall_on_critical = no

[history]
dir = /var/log/sysmon
retention_days = 7
max_total_mb = 100
# Stop writing history/snapshots if the filesystem has less free space (MB).
min_fs_free_mb = 2048

[snapshots]
max_files = 300
max_total_mb = 150
# While CRITICAL, take another snapshot this often (seconds).
critical_interval = 120
top_n = 15
